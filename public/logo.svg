<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kramix-bg-h" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" />
      <stop offset="0.5" stop-color="#0f172a" />
      <stop offset="1" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="kramix-spine-h" x1="12" y1="12" x2="24" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" />
      <stop offset="0.6" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="kramix-arm-up-h" x1="24" y1="32" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="kramix-arm-down-h" x1="24" y1="32" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" />
      <stop offset="0.6" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>

    <radialGradient id="kramix-pulse-glow-h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="kramix-stroke-h" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="kramix-text-grad" x1="72" y1="20" x2="200" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="kramix-badge-grad" x1="184" y1="22" x2="222" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="13" fill="url(#kramix-bg-h)" stroke="url(#kramix-stroke-h)" stroke-width="1.8" />
    <rect x="11" y="11" width="8" height="34" rx="4" fill="url(#kramix-spine-h)" />
    <path d="M22 27C23.5 25.5 25 23.5 27 21L39 12.5C40.6 11.3 43 12.4 43 14.3C43 15.3 42.4 16.2 41.6 16.8L30 25.5C28.5 26.7 28.5 29 30 30.2L42 39.5C42.8 40.2 43.1 41.2 43 42.2C42.8 44 40.5 44.9 39 43.6L27 34.5C25 32.8 23.5 30.5 22 29" fill="url(#kramix-arm-up-h)" />
    <path d="M29 29L39.5 38C40.7 39 40.9 40.8 39.9 42C38.9 43.2 37.1 43.4 35.9 42.4L24.5 33.2C23.1 32 22.2 30.4 21.8 28.8" fill="url(#kramix-arm-down-h)" />
    <circle cx="24.5" cy="28" r="4" fill="url(#kramix-pulse-glow-h)" />
    <circle cx="24.5" cy="28" r="1.8" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="74" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="1.5" fill="url(#kramix-text-grad)">KRAMIX</text>

  <!-- AI Badge -->
  <rect x="186" y="21" width="34" height="22" rx="6" fill="#1e1b4b" stroke="url(#kramix-badge-grad)" stroke-width="1.2" />
  <text x="194" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">AI</text>
</svg>
